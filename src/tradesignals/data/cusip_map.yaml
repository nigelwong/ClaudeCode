# Manually maintained CUSIP -> ticker mapping, scoped to watchlist.yaml.
#
# Why this exists: 13F infotables report holdings by CUSIP, and CUSIP is a
# paid identifier owned by CUSIP Global Services / ABA -- there is no free
# official CUSIP<->ticker mapping at market scale. For a small, fixed
# watchlist (~20-50 names) a static table is tractable instead.
#
# IMPORTANT: verify/refresh these periodically against an authoritative
# source (e.g. any real 13F infotable.xml that includes the issuer, which
# lists nameOfIssuer next to cusip) before relying on them -- a stale or
# incorrect entry just means that ticker's institutional-holdings signal
# silently goes inactive, not that data is wrong, but it should still be
# kept current when tickers are added to or removed from watchlist.yaml.
