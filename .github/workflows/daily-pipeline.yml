name: Daily Trading Signals Pipeline

on:
  schedule:
    # 21:30 UTC = 4:30pm EDT / 5:30pm EST -- comfortably after the 4pm ET
    # market close under either daylight-saving state.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run daily signal pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: tradesignals run-daily

      - name: Run market outlook pipeline
        continue-on-error: true  # a FRED outage must never block the run-daily report's commit
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: tradesignals market-outlook

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes (e.g. market holiday) -- skipping commit."
          else
            git commit -m "Daily signals report: $(date -u +%Y-%m-%d)"
            git push
          fi
