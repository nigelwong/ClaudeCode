[project]
name = "tradesignals"
version = "0.1.0"
description = "Daily US-equity swing-trading signals with deterministic backtesting"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
tradesignals = "tradesignals.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
